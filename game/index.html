<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Palms — Palmera Bay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e18; }
  body {
    background:
      radial-gradient(120% 90% at 50% 0%, #2a1245 0%, #160b2e 52%, #07070f 100%);
  }
  #game {
    position: fixed; inset: 0; margin: auto; display: block; touch-action: none;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    box-shadow: 0 0 90px rgba(255, 46, 136, 0.22), 0 0 34px rgba(20, 200, 220, 0.16);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Palms: a top-down open-world crime game set in Palmera Bay. Walk and drive with WASD, press E to enter cars and talk, aim with the mouse."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
